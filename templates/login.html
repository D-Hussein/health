{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="card login-card">
        <div style="text-align:center;font-size:42px;">👑</div>
        <h2>Lima Life Crown</h2>
        <p class="subtitle muted">Home-care monitoring · Staff sign in</p>
        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label for="cpr">CPR / Username</label>
                <input type="text" id="cpr" name="cpr" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Sign in</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
