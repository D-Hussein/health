{% extends "base.html" %}
{% block title %}Edit {{ nurse.name }}{% endblock %}
{% block content %}
<div class="page-header"><div><div class="breadcrumb"><a href="{{ url_for('manage_users') }}">Staff</a></div><h2>Edit {{ nurse.name }}</h2></div></div>
<form method="POST" action="{{ url_for('edit_user', user_id=nurse.id) }}" class="card form-card">
    {% include "_user_form.html" %}
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('manage_users') }}" class="btn">Cancel</a></div>
</form>
{% endblock %}
