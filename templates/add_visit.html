{% extends "base.html" %}
{% block title %}Record visit{% endblock %}
{% block content %}
<div class="page-header"><div>
    <div class="breadcrumb"><a href="{{ url_for('dashboard') }}">Patients</a> / <a href="{{ url_for('client_detail', client_id=client.id) }}">{{ client.name }}</a></div>
    <h2>Record visit</h2>
</div></div>
<form method="POST" class="card form-card">
    <div class="grid grid-3" style="gap:16px">
        <div class="form-group"><label for="date">Date</label><input type="date" id="date" name="date" value="{{ now.date() }}" required></div>
        <div class="form-group"><label for="time">Time</label><input type="time" id="time" name="time" value="{{ now.strftime('%H:%M') }}" required></div>
        <div class="form-group"><label for="next_visit_date">Next visit</label><input type="date" id="next_visit_date" name="next_visit_date"></div>
    </div>
    <div class="form-group"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="6"></textarea></div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save visit</button>
        <a href="{{ url_for('client_detail', client_id=client.id) }}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
