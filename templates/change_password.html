{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-header"><div><h2>Change password</h2><p class="subtitle">Use at least 8 characters.</p></div></div>
<form method="POST" action="{{ url_for('change_password') }}" class="card form-card" style="max-width:460px">
    <div class="form-group"><label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" autocomplete="current-password" required></div>
    <div class="form-group"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="8"></div>
    <div class="form-group"><label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8"></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Change password</button></div>
</form>
{% endblock %}
